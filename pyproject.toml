[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crd-notes"
version = "0.1.0"
description = "Local-first meeting transcription and AI summary tool."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "CRD Notes contributors" }
]
keywords = ["transcription", "whisper", "fastapi", "meeting-notes", "ai"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Office/Business",
]
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "python-multipart==0.0.20",
  "pydantic==2.10.5",
  "pydantic-settings==2.7.1",
  "httpx==0.28.1",
  "requests==2.32.3",
  "faster-whisper==1.1.1",
  "imageio-ffmpeg==0.5.1",
  "chromadb==1.1.1",
  "sentence-transformers==5.1.2",
  "pypdf==5.5.0",
  "python-docx==1.1.2",
  "openpyxl==3.1.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
crd-notes = "crd_notes.app:run"

[tool.setuptools.packages.find]
include = ["crd_notes*"]

[tool.setuptools.package-data]
crd_notes = [
  "web/index.html",
  "web/static/*",
  "ai/prompt_templates/*.md",
  "chat/prompt_templates/*.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
